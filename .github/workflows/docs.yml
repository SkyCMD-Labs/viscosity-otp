name: Docs

on:
  push:
    paths:
      - "**.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            !node_modules/**

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee (link checker)
        uses: lycheeverse/lychee-action@v2
        with:
          # Check markdown files; ignore localhost and mailto, and be tolerant of transient failures.
          args: >
            --verbose
            --no-progress
            --accept 200,204,206,301,302,303,307,308,429
            --max-redirects 10
            --retry-wait-time 2
            --max-retries 3
            --exclude "^(http://localhost|https://localhost)"
            "**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

